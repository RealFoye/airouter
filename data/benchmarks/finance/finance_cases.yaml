- id: FIN-POL-001
  domain: FINANCE_OFFICE
  category: POLICY_QA
  task_type: DATA_PROCESSING
  complexity: SIMPLE
  prompt: 员工在北京住宿 680 元/晚，发票抬头合规。根据制度最多可报多少？只输出 JSON。
  input_context: '# 差旅及费用报销制度（Synthetic）


    适用范围：员工差旅、客户拜访、培训及项目执行费用报销。


    ## 发票与时限

    - 发票抬头必须为“广州视源电子科技股份有限公司”，个人抬头不可报销。

    - 报销应在费用发生后 30 天内提交，逾期需部门负责人审批；本 benchmark 中无审批附件时按不可报销处理。

    - 同一发票号码不得重复报销。


    ## 住宿

    - 一线城市（北京、上海、广州、深圳）住宿标准上限为 600 元/晚。

    - 其他城市住宿标准上限为 450 元/晚。

    - 超出标准部分不可报销。


    ## 餐费

    - 员工个人餐费上限为 120 元/人/天。

    - 客户招待餐费上限为 200 元/人/次，必须填写客户人数和业务目的。

    - 酒水、私人聚餐不可报销。


    ## 交通

    - 市内出租车单次 100 元以内可直接报销，超过 100 元需说明路线并经主管审批；无审批附件时超出部分不可报销。

    - 机票仅报销经济舱。发票抬头不合规时整笔机票不可报销。'
  artifacts:
  - artifacts/policies/travel_policy.md
  output_format:
    type: json
    required_fields:
    - decision
    - amounts
    - findings
    - evidence
    - confidence
  expected_answer:
    amounts:
      approved_amount_cny: 600.0
      rejected_amount_cny: 80.0
    required_findings:
    - Beijing tier1 cap 600
    decision: partial_approve
  evaluation:
    primary: rule_based
    numeric_tolerance: 0.01
    penalize_hallucinated_findings: true
    evidence_required: true
    scoring_type: finance_policy_qa
    exact_amounts:
    - approved_amount_cny
    - rejected_amount_cny
    required_findings:
    - '600'
  max_tokens: 8192
  tags:
  - policy
  - qa
  notes: 制度问答。
