    penalize_hallucinated_findings: true
    evidence_required: true
    scoring_type: finance_duplicate
    exact_amounts:
    - duplicate_risk_amount_cny
    required_findings:
    - INV-T-4001
  max_tokens: 8192
  tags:
  - duplicate
  - invoice
  notes: 重复发票检测。
