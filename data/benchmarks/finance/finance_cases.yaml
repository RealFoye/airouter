version: finance-1.0
description: Synthetic enterprise finance office benchmark for table calculation, reimbursement audit, AP matching, bank reconciliation,
  budget analysis, and policy QA.
source_policy: Fictional data. Public benchmarks are used only as task-shape inspiration, not copied cases.
public_inspirations:
- name: SpreadsheetBench
  url: https://spreadsheetbench.github.io/
  used_for: spreadsheet task patterns
- name: FinanceBench
  url: https://huggingface.co/datasets/PatronusAI/financebench
  used_for: finance document QA framing
- name: FinQA
  url: https://finqasite.github.io/
  used_for: financial numerical reasoning
- name: TAT-QA
  url: https://nextplusplus.github.io/TAT-QA/
  used_for: table-text question answering
- name: DocILE
  url: https://docile.rossum.ai/
  used_for: invoice/purchase-order document tasks
models:
- qwen3.7-max
- qwen3.7-plus
- deepseek-v4-flash
- deepseek-v4-pro
- glm-5.1
scoring_principles:
- Numeric fields are rule-scored with cent-level tolerance.
- Required findings are recall-scored with evidence requirements.
- Hallucinated violations should be penalized.
- LLM judge may assess explanation quality but must not override numeric ground truth.
cases:
- id: FIN-TAB-001
  domain: FINANCE_OFFICE
  category: TABLE_CALCULATION
  task_type: DATA_PROCESSING
  complexity: SIMPLE
  prompt: 根据费用表计算 ER-1001 的原始合计金额。只输出 JSON。
  input_context: '费用表 expense_claims_may.csv：

    ER-1001: hotel Shanghai 680; client_meal 420 with 2 attendees; taxi 95.

    ER-1002: flight Guangzhou-Beijing 1580 with personal invoice title 李娜; hotel Beijing 520.

    ER-1003: training_meal Hangzhou 180 with 1 attendee; hotel Hangzhou 430.

    ER-1004: taxi 88 invoice INV-T-4001 appears twice; client_meal 360 with 1 attendee and empty purpose.

    ER-1005: hotel Chengdu 470; taxi Chengdu 132, no approval.'
  artifacts:
  - artifacts/expenses/expense_claims_may.csv
  output_format:
    type: json
    required_fields:
    - decision
    - amounts
    - findings
    - evidence
    - confidence
  expected_answer:
    amounts:
      raw_total_cny: 1195.0
    required_findings: []
    decision: calculate
  evaluation:
    primary: rule_based
    numeric_tolerance: 0.01
    penalize_hallucinated_findings: true
    evidence_required: true
    scoring_type: finance_numeric
    exact_amounts:
    - raw_total_cny
  max_tokens: 8192
  tags:
  - spreadsheet
  - sum
  notes: 基础合计，类似 SpreadsheetBench 的表格聚合任务。
- id: FIN-TAB-002
  domain: FINANCE_OFFICE
  category: TABLE_CALCULATION
  task_type: DATA_PROCESSING
  complexity: MODERATE
  prompt: 按部门汇总费用表中的原始报销金额，并找出金额最高的部门。只输出 JSON。
  input_context: '费用表 expense_claims_may.csv：

    ER-1001: hotel Shanghai 680; client_meal 420 with 2 attendees; taxi 95.

    ER-1002: flight Guangzhou-Beijing 1580 with personal invoice title 李娜; hotel Beijing 520.

    ER-1003: training_meal Hangzhou 180 with 1 attendee; hotel Hangzhou 430.

    ER-1004: taxi 88 invoice INV-T-4001 appears twice; client_meal 360 with 1 attendee and empty purpose.

    ER-1005: hotel Chengdu 470; taxi Chengdu 132, no approval.'
  artifacts:
  - artifacts/expenses/expense_claims_may.csv
  output_format:
    type: json
    required_fields:
    - decision
    - amounts
    - findings
    - evidence
    - confidence
  expected_answer:
    amounts:
      Sales: 1731.0
      R&D: 2100.0
      Finance: 610.0
      HR: 602.0
    top_item:
      dept: R&D
      amount_cny: 2100.0
    decision: calculate
  evaluation:
    primary: rule_based
    numeric_tolerance: 0.01
    penalize_hallucinated_findings: true
    evidence_required: true
    scoring_type: finance_groupby
    exact_amounts:
    - Sales
    - R&D
    - Finance
    - HR
  max_tokens: 8192
  tags:
  - spreadsheet
  - groupby
  notes: 部门维度分类汇总。
- id: FIN-TAB-003
  domain: FINANCE_OFFICE
  category: TABLE_CALCULATION
  task_type: DATA_PROCESSING
  complexity: MODERATE
  prompt: 根据差旅制度，计算 ER-1001 可报销金额、不可报销金额，并列出原因。只输出 JSON。
  input_context: '# 差旅及费用报销制度（Synthetic）


    适用范围：员工差旅、客户拜访、培训及项目执行费用报销。


    ## 发票与时限

    - 发票抬头必须为“广州视源电子科技股份有限公司”，个人抬头不可报销。

    - 报销应在费用发生后 30 天内提交，逾期需部门负责人审批；本 benchmark 中无审批附件时按不可报销处理。

    - 同一发票号码不得重复报销。


    ## 住宿

    - 一线城市（北京、上海、广州、深圳）住宿标准上限为 600 元/晚。

    - 其他城市住宿标准上限为 450 元/晚。

    - 超出标准部分不可报销。


    ## 餐费

    - 员工个人餐费上限为 120 元/人/天。

    - 客户招待餐费上限为 200 元/人/次，必须填写客户人数和业务目的。

    - 酒水、私人聚餐不可报销。


    ## 交通

    - 市内出租车单次 100 元以内可直接报销，超过 100 元需说明路线并经主管审批；无审批附件时超出部分不可报销。

    - 机票仅报销经济舱。发票抬头不合规时整笔机票不可报销。



    费用表 expense_claims_may.csv：

    ER-1001: hotel Shanghai 680; client_meal 420 with 2 attendees; taxi 95.

    ER-1002: flight Guangzhou-Beijing 1580 with personal invoice title 李娜; hotel Beijing 520.

    ER-1003: training_meal Hangzhou 180 with 1 attendee; hotel Hangzhou 430.

    ER-1004: taxi 88 invoice INV-T-4001 appears twice; client_meal 360 with 1 attendee and empty purpose.

    ER-1005: hotel Chengdu 470; taxi Chengdu 132, no approval.'
  artifacts:
  - artifacts/policies/travel_policy.md
  - artifacts/expenses/expense_claims_may.csv
  output_format:
    type: json
    required_fields:
    - decision
    - amounts
    - findings
    - evidence
    - confidence
  expected_answer:
    amounts:
      approved_amount_cny: 1095.0
      rejected_amount_cny: 100.0
    required_findings:
    - hotel_over_limit_80
    - client_meal_over_limit_20
    decision: partial_approve
  evaluation:
    primary: rule_based
    numeric_tolerance: 0.01
    penalize_hallucinated_findings: true
    evidence_required: true
    scoring_type: finance_policy_numeric
    exact_amounts:
    - approved_amount_cny
    - rejected_amount_cny
    required_findings:
    - hotel_over_limit_80
    - client_meal_over_limit_20
  max_tokens: 8192
  tags:
  - policy
  - reimbursement
  notes: 计算+制度套用。
