  - id: "L1-SIMPLE-006"
    prompt: "写一个简单的Docker配置文件"
    expected_task_type: "DEVOPS"
    expected_complexity: "SIMPLE"
    expected_risk: "LOW"
    expected_strategy: "SINGLE_MODEL"
