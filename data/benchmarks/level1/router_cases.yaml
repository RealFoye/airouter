  # 注：当前 Selector 评分中 SINGLE_MODEL 通常优于 PE/PER（因 Tier 1 质量相同但 PE 有额外成本）
  # 这些 case 验证 PE 的结构条件判断逻辑，而非 PE 策略最终胜出
  - id: "L1-PE-001"
