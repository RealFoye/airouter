    expected_requires_human_review: false
    tags: ["simple", "test"]
    notes: "TEST_GENERATION + SIMPLE + LOW → Tier 3"

  - id: "L1-SIMPLE-005"
    prompt: "给这个项目写一个README文档"
    expected_task_type: "DOCUMENTATION"
    expected_complexity: "SIMPLE"
    expected_risk: "LOW"
    expected_strategy: "SINGLE_MODEL"
    expected_executor_tier: 3
    expected_requires_human_review: false
    tags: ["simple", "docs"]
