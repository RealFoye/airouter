  # ── 3. 复杂/专家任务（6 条） ─────────────────────────────────
  - id: "L1-COMPLEX-001"
    prompt: "设计百万级并发的分布式微服务架构以及消息队列系统"
    expected_task_type: "ARCHITECTURE"
    expected_complexity: "EXPERT"
    expected_risk: "HIGH"
    expected_strategy: "SINGLE_MODEL"
    expected_executor_tier: 1
    expected_requires_human_review: true
    expected_quality_gate_contains: ["human_review"]
    tags: ["expert", "architecture"]
    notes: "EXPERT ARCHITECTURE → Tier 1, forced review (SINGLE_MODEL wins over PE/PER in scoring)"

  - id: "L1-COMPLEX-002"
    prompt: "实现跨模块的鉴权中间件"
    expected_task_type: "CODE_GENERATION"
    expected_complexity: "COMPLEX"
    expected_risk: "HIGH"
    expected_strategy: "SINGLE_MODEL"
    expected_requires_human_review: true
    tags: ["complex", "codegen", "high-risk"]
    notes: "COMPLEX + HIGH risk → SINGLE_MODEL, review (removed 高并发 to avoid ARCHITECTURE)"

  - id: "L1-COMPLEX-003"
    prompt: "重构跨模块的分布式系统核心代码并且解耦多个服务"
    expected_task_type: "REFACTORING"
    expected_complexity: "COMPLEX"
    expected_risk: "HIGH"
    expected_strategy: "GUIDED_EXECUTE"
    expected_requires_human_review: true
    tags: ["complex", "refactor", "high-risk"]
    notes: "COMPLEX REFACTORING + HIGH → GUIDED_EXECUTE wins scoring"

  - id: "L1-COMPLEX-004"
    prompt: "调试分布式系统中的死锁问题以及内存泄漏并且分析堆栈"
