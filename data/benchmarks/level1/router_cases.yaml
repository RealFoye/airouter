    expected_risk: "HIGH"
    expected_strategy: "SINGLE_MODEL"
    expected_requires_human_review: false
    tags: ["complex", "bug", "high-risk"]
    notes: "COMPLEX BUG_ANALYSIS + HIGH → SINGLE_MODEL+Tier1, no Gate condition 2 (no degradation)"

  - id: "L1-COMPLEX-005"
    prompt: "设计百万级用户的系统级全局权限管理架构"
    expected_task_type: "ARCHITECTURE"
    expected_complexity: "EXPERT"
    expected_risk: "HIGH"
    expected_strategy: "SINGLE_MODEL"
    expected_executor_tier: 1
