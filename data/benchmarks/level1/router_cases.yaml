    expected_complexity: "MODERATE"
    expected_risk: "MEDIUM"
    expected_strategy: "SINGLE_MODEL"
    tags: ["moderate", "bug"]
    notes: "BUG_ANALYSIS + MODERATE + MEDIUM (修改=MEDIUM risk)"

