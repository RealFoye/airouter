version: "1.0"
description: "Level 1 offline rule benchmark cases"

cases:
  # ── 1. 简单任务省钱路径（6 条） ──────────────────────────────
  - id: "L1-SIMPLE-001"
    prompt: "写一个Python函数检查回文"
    expected_task_type: "CODE_GENERATION"
    expected_complexity: "SIMPLE"
    expected_risk: "LOW"
    expected_strategy: "SINGLE_MODEL"
    expected_executor_tier: 3
    expected_requires_human_review: false
    tags: ["simple", "codegen"]
    notes: "SIMPLE + LOW → Tier 3, SINGLE_MODEL, 不审批"

  - id: "L1-SIMPLE-002"
    prompt: "什么是闭包？解释一下Python中闭包的概念"
    expected_task_type: "CONVERSATION"
    expected_complexity: "SIMPLE"
    expected_risk: "LOW"
    expected_strategy: "SINGLE_MODEL"
    expected_executor_tier: 3
    expected_requires_human_review: false
    tags: ["simple", "conversation"]
    notes: "CONVERSATION + SIMPLE + LOW → Tier 3"

  - id: "L1-SIMPLE-003"
    prompt: "写一个CSV解析脚本处理数据"
    expected_task_type: "DATA_PROCESSING"
    expected_complexity: "SIMPLE"
    expected_risk: "LOW"
    expected_strategy: "SINGLE_MODEL"
    expected_executor_tier: 3
    expected_requires_human_review: false
    tags: ["simple", "data"]
    notes: "DATA_PROCESSING + SIMPLE + LOW → Tier 3"

  - id: "L1-SIMPLE-004"
    prompt: "给add函数写一个单元测试"
