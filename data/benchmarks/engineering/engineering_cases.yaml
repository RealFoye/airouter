      paginate([1,2,3,4,5], page=2, size=2) -> [3,4]
    artifacts: []
    expected_behavior:
      - "识别 page 是 1-based，而当前实现按 0-based 计算。"
      - "将 start 改为 (page - 1) * size。"
      - "保留函数签名。"
      - "建议补充 page 小于 1 的行为或测试。"
    forbidden_behavior:
      - "不要引入新的分页协议。"
      - "不要修改调用方假设。"
      - "不要声称测试通过。"
    evaluation:
      primary: rule_based
      required_findings:
        - "off-by-one"
        - "page - 1"
      forbidden_findings: []
      required_outputs:
        - "minimal patch"
        - "validation"
      forbidden_outputs:
        - "rewrite API"
        - "测试已通过"
      must_not_modify: []
      should_ask_clarification: false
      requires_human_approval: false
      runnable_validation: true
    max_tokens: 2048
    tags:
      - off_by_one
      - pagination
      - minimal_patch
