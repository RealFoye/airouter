  - id: "BA-CONC-001"
    task_type: "BUG_ANALYSIS"
    complexity: "COMPLEX"
    prompt: "分析以下多线程代码的问题：\n\n```python\nimport threading\n\ncounter = 0\n\ndef increment():\n    global counter\n    for _ in range(100000):\n        counter += 1\n\nthreads = [threading.Thread(target=increment) for _ in range(10)]\nfor t in threads:\n    t.start()\nfor t in threads:\n    t.join()\n\nprint(counter)  # 预期: 1000000, 实际: 不确定\n```"
