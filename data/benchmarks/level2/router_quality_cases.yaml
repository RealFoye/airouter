        - id: empty_check
          any_of: ["empty", "空列表", "if not items", "len(items) == 0"]
    expected_issues:
      - "index_error"
    scoring_type: "bug_analysis"
    tags: ["runtime", "bug_analysis"]
    notes: "IndexError 列表越界"

