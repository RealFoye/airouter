version: "2.0"
description: "Level 2 model quality benchmark - 30 core cases"
models:
  - "qwen3.7-max"
  - "qwen3.7-plus"
  - "deepseek-v4-flash"

cases:
  # ── Code Generation 6 (CG) ──────────────────────────────────

  - id: "CG-SIMPLE-001"
    task_type: "CODE_GENERATION"
    complexity: "SIMPLE"
    prompt: "写一个Python函数检查字符串是否为回文（palindrome），忽略大小写和非字母数字字符"
    input_context: ""
    max_tokens: 1024
    evaluation_criteria:
      must_have:
        - id: function_def
          any_of: ["def ", "lambda "]
        - id: return_statement
          any_of: ["return"]
        - id: reverse_logic
          any_of: ["[::-1]", "reversed", "reverse", "双指针", "two pointer"]
        - id: filter_chars
          any_of: ["isalnum", "isalpha", "filter", "lower", "strip"]
      nice_to_have:
        - id: type_hint
          any_of: ["->", ": str", ": bool"]
        - id: docstring
          any_of: ['"""', "'''", "docstring"]
    expected_issues: []
    scoring_type: "code_generation"
    tags: ["simple", "codegen", "string"]
    notes: "简单回文检查"

  - id: "CG-SIMPLE-002"
    task_type: "CODE_GENERATION"
    complexity: "SIMPLE"
    prompt: "写一个函数，输入一个整数列表，对于1到n的每个数字：如果能被3和5同时整除打印'FizzBuzz'，被3整除打印'Fizz'，被5整除打印'Buzz'，否则打印数字本身。返回结果列表。"
    input_context: ""
    max_tokens: 1024
    evaluation_criteria:
      must_have:
        - id: function_def
          any_of: ["def ", "lambda "]
        - id: return_list
          any_of: ["return", "yield"]
        - id: modulo_logic
          any_of: ["% 15", "% 3", "% 5", "%15", "%3", "%5"]
        - id: loop
          any_of: ["for ", "while "]
      nice_to_have:
        - id: type_hint
          any_of: ["->", ": int", ": list"]
        - id: docstring
          any_of: ['"""', "'''"]
    expected_issues: []
    scoring_type: "code_generation"
    tags: ["simple", "codegen", "loop"]
    notes: "FizzBuzz 变体"

  - id: "CG-MOD-001"
    task_type: "CODE_GENERATION"
    complexity: "MODERATE"
    prompt: "实现一个基于滑动窗口的API限流中间件。要求：使用固定窗口算法，支持每秒最多N个请求，超限返回429状态码。实现为Python装饰器或中间件类。"
    input_context: ""
    max_tokens: 2048
    evaluation_criteria:
      must_have:
        - id: class_or_decorator
          any_of: ["class ", "def rate_limit", "@", "decorator", "装饰器"]
        - id: window_logic
          any_of: ["window", "窗口", "sliding", "滑动", "time.time", "time.monotonic"]
        - id: counter
          any_of: ["count", "counter", "计数器", "requests"]
        - id: limit_check
          any_of: ["429", "too many", "rate limit", "exceed", "超限", "限流"]
        - id: return_or_raise
          any_of: ["return", "raise", "HTTPException"]
      nice_to_have:
        - id: thread_safe
          any_of: ["lock", "threading", "mutex", "线程安全"]
        - id: config
          any_of: ["max_requests", "rate", "limit", "配置"]
    expected_issues: []
    scoring_type: "code_generation"
    tags: ["moderate", "codegen", "middleware"]
    notes: "滑动窗口限流"

  - id: "CG-MOD-002"
    task_type: "CODE_GENERATION"
    complexity: "MODERATE"
    prompt: "实现JWT token的生成和验证模块。要求：使用HS256算法，支持payload中包含user_id和过期时间(exp)，提供generate_token和verify_token两个函数。"
    input_context: ""
    max_tokens: 2048
    evaluation_criteria:
      must_have:
        - id: generate_func
          any_of: ["def generate_token", "def generate", "def create_token", "def create"]
        - id: verify_func
          any_of: ["def verify_token", "def verify", "def decode_token", "def decode"]
        - id: jwt_usage
          any_of: ["jwt", "pyjwt", "jose", "hmac"]
        - id: payload
          any_of: ["user_id", "payload", "exp", "过期"]
        - id: algorithm
          any_of: ["hs256", "HS256", "algorithm", "算法"]
      nice_to_have:
        - id: secret_key
          any_of: ["secret", "SECRET_KEY", "key", "密钥"]
        - id: exception
          any_of: ["except", "ExpiredSignatureError", "InvalidTokenError", "try"]
    expected_issues: []
    scoring_type: "code_generation"
    tags: ["moderate", "codegen", "security"]
    notes: "JWT token 模块"

  - id: "CG-COMPLEX-001"
    task_type: "CODE_GENERATION"
    complexity: "COMPLEX"
    prompt: "设计并实现一个简单的分布式任务队列，支持：1) 生产者提交任务到队列 2) 多个消费者并发处理任务 3) 任务失败自动重试(最多3次) 4) 任务结果回调通知。使用Python threading或asyncio实现。"
    input_context: ""
    max_tokens: 4096
    evaluation_criteria:
      must_have:
        - id: queue_structure
          any_of: ["queue", "Queue", "队列", "deque"]
        - id: producer
          any_of: ["producer", "submit", "enqueue", "生产者", "提交"]
        - id: consumer
          any_of: ["consumer", "worker", "dequeue", "消费者", "处理"]
        - id: concurrency
          any_of: ["thread", "Thread", "asyncio", "concurrent", "并发"]
        - id: retry_logic
          any_of: ["retry", "retries", "重试", "max_retries", "attempt"]
        - id: callback
          any_of: ["callback", "on_complete", "notify", "回调", "通知"]
      nice_to_have:
        - id: error_handling
          any_of: ["try", "except", "error", "异常"]
        - id: task_status
          any_of: ["status", "pending", "completed", "failed", "状态"]
    expected_issues: []
    scoring_type: "code_generation"
    tags: ["complex", "codegen", "concurrency"]
    notes: "分布式任务队列"

  - id: "CG-COMPLEX-002"
    task_type: "CODE_GENERATION"
    complexity: "COMPLEX"
    prompt: "实现一个异步网页爬虫框架，要求：1) 支持并发爬取多个URL 2) 带限速控制(每秒最多N个请求) 3) 失败自动重试 4) 结果存储(标题、URL、状态码)。使用asyncio + aiohttp。"
    input_context: ""
    max_tokens: 4096
    evaluation_criteria:
      must_have:
        - id: async_pattern
          any_of: ["async def", "await", "asyncio"]
        - id: http_client
          any_of: ["aiohttp", "httpx", "requests"]
        - id: concurrency
          any_of: ["gather", "create_task", "semaphore", "Semaphore", "并发"]
        - id: rate_limit
          any_of: ["rate", "limit", "限速", "sleep", "throttle"]
        - id: retry_logic
          any_of: ["retry", "retries", "重试", "attempt"]
        - id: result_storage
          any_of: ["title", "标题", "url", "status", "result", "结果"]
      nice_to_have:
        - id: error_handling
          any_of: ["try", "except", "timeout", "error"]
        - id: logging
          any_of: ["logger", "logging", "log", "日志"]
    expected_issues: []
    scoring_type: "code_generation"
    tags: ["complex", "codegen", "async"]
    notes: "异步爬虫框架"

  # ── Code Review 6 (CR) ─────────────────────────────────────

  - id: "CR-SEC-001"
    task_type: "CODE_REVIEW"
    complexity: "MODERATE"
    prompt: "请审查以下代码，指出所有安全问题和改进建议：\n\n```python\ndef get_user(user_id):\n    query = \"SELECT * FROM users WHERE id = \" + str(user_id)\n    cursor = db.connection.cursor()\n    cursor.execute(query)\n    return cursor.fetchone()\n\ndef login(username, password):\n    user = get_user_by_name(username)\n    if user and user.password == password:\n        return {'status': 'ok', 'user': user}\n    return {'status': 'fail'}\n```"
    input_context: "def get_user(user_id):\n    query = \"SELECT * FROM users WHERE id = \" + str(user_id)\n    cursor = db.connection.cursor()\n    cursor.execute(query)\n    return cursor.fetchone()"
    max_tokens: 2048
    evaluation_criteria:
      must_have:
        - id: sql_injection_found
          any_of: ["sql injection", "sql注入", "parameterized", "参数化", "prepared statement", "拼接"]
        - id: password_issue
          any_of: ["password", "密码", "明文", "plaintext", "hash", "哈希", "bcrypt"]
      nice_to_have:
        - id: fix_suggestion
          any_of: ["fix", "修复", "建议", "should", "recommend", "改为"]
    expected_issues:
      - "sql_injection"
      - "hardcoded_secret"
    scoring_type: "code_review"
    tags: ["security", "code_review"]
    notes: "SQL注入 + 明文密码"

  - id: "CR-SEC-002"
    task_type: "CODE_REVIEW"
    complexity: "MODERATE"
    prompt: "请审查以下代码的安全问题：\n\n```python\nimport random\n\nAPI_KEY = \"sk-proj-abc123def456\"\n\ndef generate_token():\n    return random.random()\n\ndef encrypt_data(data):\n    key = \"mysecretkey12345\"\n    encrypted = \"\"\n    for i, c in enumerate(data):\n        encrypted += chr(ord(c) ^ ord(key[i % len(key)]))\n    return encrypted\n```"
    input_context: ""
    max_tokens: 2048
    evaluation_criteria:
      must_have:
        - id: hardcoded_key
          any_of: ["hardcoded", "硬编码", "secret", "密钥", "api_key", "credential", "api key"]
        - id: weak_random
          any_of: ["random.random", "不安全的随机", "insecure random", "secrets", "cryptographic"]
        - id: weak_encryption
          any_of: ["xor", "异或", "weak", "弱加密", "encrypt", "加密"]
      nice_to_have:
        - id: env_var
          any_of: ["环境变量", "environment variable", "os.environ", ".env", "dotenv"]
    expected_issues:
      - "hardcoded_secret"
    scoring_type: "code_review"
    tags: ["security", "code_review"]
    notes: "硬编码密钥 + 不安全随机数 + 弱加密"

  - id: "CR-PERF-001"
    task_type: "CODE_REVIEW"
    complexity: "MODERATE"
    prompt: "请审查以下代码的性能问题：\n\n```python\ndef get_all_orders():\n    orders = Order.objects.all()\n    result = []\n    for order in orders:\n        customer = Customer.objects.get(id=order.customer_id)\n        items = OrderItem.objects.filter(order_id=order.id)\n        for item in items:\n            product = Product.objects.get(id=item.product_id)\n            item.product_name = product.name\n        order.customer_name = customer.name\n        order.items = items\n        result.append(order)\n    return result\n```"
    input_context: ""
    max_tokens: 2048
    evaluation_criteria:
      must_have:
        - id: n_plus_one
          any_of: ["n+1", "n + 1", "eager loading", "预加载", "select_related", "prefetch_related", "n+1 query"]
        - id: query_in_loop
          any_of: ["循环中查询", "query in loop", "循环查询", "批量", "bulk"]
      nice_to_have:
        - id: index_suggestion
          any_of: ["index", "索引", "缺少索引", "missing index"]
        - id: fix_suggestion
          any_of: ["fix", "修复", "建议", "should", "select_related", "prefetch"]
    expected_issues:
      - "n_plus_one"
      - "missing_index"
    scoring_type: "code_review"
    tags: ["performance", "code_review"]
    notes: "N+1 查询"

  - id: "CR-PERF-002"
    task_type: "CODE_REVIEW"
    complexity: "MODERATE"
    prompt: "请审查以下代码的资源管理问题：\n\n```python\nimport requests\n\ndef fetch_all_urls(urls):\n    results = []\n    sessions = []\n    for url in urls:\n        session = requests.Session()\n        sessions.append(session)\n        resp = session.get(url)\n        results.append(resp.text)\n    return results\n\ndef process_files(file_paths):\n    files = []\n    for path in file_paths:\n        f = open(path, 'r')\n        files.append(f)\n        data = f.read()\n    return [f.name for f in files]\n```"
    input_context: ""
    max_tokens: 2048
    evaluation_criteria:
      must_have:
        - id: resource_leak
          any_of: ["memory leak", "内存泄漏", "unclosed", "未关闭", "connection pool", "资源泄漏", "resource leak"]
        - id: context_manager
          any_of: ["with ", "context manager", "上下文管理器", "__enter__", "finally"]
        - id: session_close
          any_of: ["close", "关闭", "session.close"]
      nice_to_have:
        - id: fix_suggestion
          any_of: ["fix", "修复", "建议", "should", "改为"]
    expected_issues:
      - "memory_leak"
    scoring_type: "code_review"
    tags: ["performance", "code_review"]
    notes: "未关闭的 Session 和文件句柄"

  - id: "CR-DESIGN-001"
    task_type: "CODE_REVIEW"
    complexity: "COMPLEX"
    prompt: "请审查以下代码的设计问题：\n\n```python\nclass UserManager:\n    def __init__(self):\n        self.db = Database()\n        self.cache = Cache()\n        self.email_service = EmailService()\n        self.sms_service = SMSService()\n\n    def create_user(self, data):\n        user = self.db.insert('users', data)\n        self.cache.set(f'user:{user.id}', user)\n        self.email_service.send_welcome(user.email)\n        self.sms_service.send_code(user.phone)\n        return user\n\n    def delete_user(self, user_id):\n        self.db.delete('users', user_id)\n        self.cache.delete(f'user:{user_id}')\n        self.email_service.send_goodbye(user_id)\n        self.db.delete('orders', user_id=user_id)\n        self.db.delete('logs', user_id=user_id)\n\n    def get_user(self, user_id):\n        cached = self.cache.get(f'user:{user_id}')\n        if cached:\n            return cached\n        return self.db.get('users', user_id)\n\n    def send_notification(self, user_id, msg):\n        user = self.get_user(user_id)\n        self.email_service.send(user.email, msg)\n        self.sms_service.send(user.phone, msg)\n```"
    input_context: ""
    max_tokens: 2048
    evaluation_criteria:
      must_have:
        - id: srp_violation
          any_of: ["single responsibility", "单一职责", "srp", "god class", "上帝类", "too many responsibilities", "职责过多"]
        - id: coupling
          any_of: ["coupling", "耦合", "dependency", "依赖", "紧耦合"]
      nice_to_have:
        - id: suggestion
          any_of: ["fix", "建议", "should", "recommend", "拆分", "分离"]
    expected_issues:
      - "srp_violation"
      - "tight_coupling"
    scoring_type: "code_review"
    tags: ["design", "code_review"]
    notes: "上帝类 + 违反 SRP"

  - id: "CR-DESIGN-002"
    task_type: "CODE_REVIEW"
    complexity: "COMPLEX"
    prompt: "请审查以下代码的架构问题：\n\n```python\n# module_a.py\nfrom module_b import ServiceB\n\nclass ServiceA:\n    def __init__(self):\n        self.b = ServiceB()\n\n    def process(self):\n        data = self.b.fetch()\n        return self._transform(data)\n\n# module_b.py\nfrom module_a import ServiceA\n\nclass ServiceB:\n    def __init__(self):\n        self.a = ServiceA()\n\n    def fetch(self):\n        return self.a.get_data()\n\n    def get_report(self):\n        return self.a.process()\n```"
    input_context: ""
    max_tokens: 2048
    evaluation_criteria:
      must_have:
        - id: circular_dep
          any_of: ["circular dependency", "循环依赖", "circular import", "循环导入", "互相依赖"]
        - id: tight_coupling
          any_of: ["tight coupling", "紧耦合", "coupling", "耦合", "依赖"]
      nice_to_have:
        - id: fix_suggestion
          any_of: ["interface", "接口", "dependency injection", "依赖注入", "decouple", "解耦"]
    expected_issues:
      - "tight_coupling"
    scoring_type: "code_review"
    tags: ["design", "code_review"]
    notes: "循环依赖 + 紧耦合"

  # ── Bug Analysis 6 (BA) ────────────────────────────────────

  - id: "BA-RT-001"
    task_type: "BUG_ANALYSIS"
    complexity: "SIMPLE"
    prompt: "分析以下代码的bug并给出修复方案：\n\n```python\ndef get_user_name(user_dict):\n    return user_dict['profile']['name']\n\n# 调用\nresult = get_user_name({'profile': None})\n```\n\n错误信息：AttributeError: 'NoneType' object has no attribute 'name'"
    input_context: ""
    max_tokens: 1024
    evaluation_criteria:
      must_have:
        - id: none_check
          any_of: ["none", "null", "attributeerror", "nonetype", "is none", "为none", "none值"]
        - id: fix
          any_of: ["fix", "修复", "if ", "check", "检查", "guard", "判断"]
      nice_to_have:
        - id: optional_chaining
          any_of: ["?.", "get(", "getattr", "or {}", "default"]
    expected_issues:
