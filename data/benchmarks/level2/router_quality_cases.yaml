          any_of: ["infinite loop", "无限循环", "死循环", "break", "while true", "没有退出条件", "no exit"]
        - id: bounds_check
          any_of: ["len(", "边界", "bound", "length", "越界", "range"]
        - id: fix
          any_of: ["fix", "修复", "while i <", "break", "if i >=", "添加条件"]
      nice_to_have:
        - id: return_default
          any_of: ["return -1", "return none", "return null", "默认值"]
