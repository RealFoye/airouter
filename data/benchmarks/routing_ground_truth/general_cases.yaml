- id: GT-DBG-001
  domain: GENERAL
  category: CODE_DEBUG
  task_type: CODE_CHANGE
  complexity: MODERATE
  risk_level: LOW
  prompt: binary_search 函数有 off-by-one 错误，请找出并修复。
  input_context: 文件 utils.py 中的 binary_search 函数在搜索最后一个元素时返回错误结果。
  workspace_files:
    utils.py: "def binary_search(arr, target):\n    \"\"\"在升序数组中二分查找目标值，返回索引，未找到返回-1。\"\"\"\n    left, right = 0, len(arr)\
      \ - 1\n    while left < right:\n        mid = (left + right) // 2\n        if arr[mid] == target:\n            return\
      \ mid\n        elif arr[mid] < target:\n            left = mid + 1\n        else:\n            right = mid - 1\n   \
      \ return -1\n"
  harness_validation:
    commands:
    - python -m pytest test_utils.py -q
    timeout_s: 10
    expected_exit_code: 0
  evaluation:
    primary: rule_based
    required_findings:
    - off-by-one
    - left < right
    - left <= right
    should_ask_clarification: false
  ground_truth:
    test_files:
    - filename: test_utils.py
      content: "from utils import binary_search\n\ndef test_found_middle():\n    assert binary_search([1, 2, 3, 4, 5], 3)\
        \ == 2\n\ndef test_found_first():\n    assert binary_search([1, 2, 3, 4, 5], 1) == 0\n\ndef test_found_last():\n \
        \   assert binary_search([1, 2, 3, 4, 5], 5) == 4\n\ndef test_not_found():\n    assert binary_search([1, 2, 3, 4,\
        \ 5], 6) == -1\n\ndef test_single_element_found():\n    assert binary_search([42], 42) == 0\n\ndef test_single_element_not_found():\n\
        \    assert binary_search([42], 7) == -1\n\ndef test_empty():\n    assert binary_search([], 1) == -1\n"
    allowed_root_causes:
    - while left < right 应为 left <= right，否则最后一个元素不会被检查
