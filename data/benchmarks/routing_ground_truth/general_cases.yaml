cases:
- id: GT-DOC-001
  domain: GENERAL
  category: DOC_UNDERSTANDING
  task_type: ANALYSIS_ONLY
  complexity: SIMPLE
  risk_level: LOW
  prompt: 请总结这份用户协议的核心条款，列出用户的主要权利和义务。
  input_context: '用户服务协议 v2.1


    第一条 服务内容

    本平台提供 AI 模型路由服务，根据用户任务自动选择最优模型。


    第二条 用户权利

    1. 用户有权获得准确的路由决策说明

    2. 用户有权查看模型调用成本明细

    3. 用户有权导出历史使用数据


    第三条 用户义务

    1. 用户不得上传恶意代码或攻击性内容

    2. 用户应确保任务描述准确完整

    3. 用户应按时支付服务费用


    第四条 免责条款

    本平台不对模型输出内容的准确性承担责任。'
  routing_metadata:
    history_messages: []
    n_tools: 0
    tool_result_length: 0
  expected_behavior:
  - 识别用户权利3条
  - 识别用户义务3条
  - 提到免责条款
  forbidden_behavior:
  - 添加协议中不存在的条款
  - 曲解条款含义
  evaluation:
    primary: rule_based
    required_findings:
    - 用户权利
    - 用户义务
    - 免责条款
    forbidden_findings:
    - 付费义务
    - 法律责任
    required_outputs:
    - 总结
    should_ask_clarification: false
  ground_truth:
    expected_fact_ids:
    - rights_3
    - obligations_3
    - disclaimer
    allowed_claims:
    - 用户有3项权利
    - 用户有3项义务
    - 平台不保证准确性
- id: GT-DOC-002
  domain: GENERAL
  category: DOC_UNDERSTANDING
  task_type: ANALYSIS_ONLY
  complexity: MODERATE
  risk_level: MEDIUM
  prompt: 分析这份隐私政策中关于数据收集的条款，列出收集了哪些类型的个人信息以及各自的用途。
  input_context: '隐私政策（节选）


    2.1 我们收集以下个人信息：

    (a) 账户注册信息：姓名、邮箱地址、手机号码，用于创建和管理用户账户。

    (b) 使用数据：访问日志、点击流数据、页面停留时间，用于改善产品体验。

    (c) 设备信息：设备型号、操作系统版本、唯一设备标识符，用于安全验证和反欺诈。

    (d) 位置信息：经用户授权后收集精确地理位置，用于提供基于位置的服务推荐。


    2.2 数据保留期限：

    账户注册信息在账户注销后保留30天；使用数据保留180天；设备信息保留90天。


    2.3 第三方共享：

    未经用户明确同意，不会将个人信息共享给第三方，法律法规要求的除外。'
  routing_metadata:
    history_messages: []
    n_tools: 0
    tool_result_length: 0
  expected_behavior:
  - 识别4类个人信息
  - 列出每类信息的用途
  - 提到保留期限
  forbidden_behavior:
  - 声称数据会永久保留
  - 编造未提及的数据类型
  evaluation:
    primary: rule_based
    required_findings:
    - 账户注册信息
    - 使用数据
    - 设备信息
    - 位置信息
    required_outputs:
    - 数据类型
    - 用途
    should_ask_clarification: false
  ground_truth:
    expected_fact_ids:
    - data_types_4
    - retention_periods
    - no_third_party
    allowed_claims:
    - 收集4类个人信息
    - 账户信息用于账户管理
    - 使用数据用于改善产品
    - 设备信息用于安全验证
    - 位置信息需用户授权
- id: GT-DOC-003
  domain: GENERAL
  category: DOC_UNDERSTANDING
  task_type: ANALYSIS_ONLY
  complexity: MODERATE
  risk_level: LOW
  prompt: 阅读这份技术方案文档，总结其核心设计思想、技术选型理由、以及潜在的风险点。
  input_context: 'RFC-2024-03: 消息队列迁移方案


    ## 背景

    当前系统使用 RabbitMQ 作为消息中间件，日均消息量已达 5000 万条。

    近期出现消息堆积和消费者延迟问题，高峰期 P99 延迟超过 5 秒。


    ## 方案

    迁移至 Apache Kafka，采用 3 节点集群部署。


    ### 技术选型理由

    1. Kafka 的顺序写磁盘机制可支撑百万级 TPS

    2. 分区机制支持水平扩展消费者组

    3. 副本机制保证数据不丢失


    ### 迁移策略

    采用双写过渡：生产者同时写入 RabbitMQ 和 Kafka，消费者逐步切换到 Kafka。

    过渡期预计 4 周。


    ### 风险

    1. 双写期间消息可能重复，需要消费端做幂等处理

    2. Kafka 运维复杂度高于 RabbitMQ，需要额外培训

    3. 网络分区时副本同步可能延迟'
  routing_metadata:
    history_messages: []
    n_tools: 0
    tool_result_length: 0
  expected_behavior:
  - 总结从 RabbitMQ 迁移到 Kafka 的核心思想
  - 列出 3 个技术选型理由
  - 识别 3 个风险点
  forbidden_behavior:
  - 建议不迁移
  - 编造文档未提及的技术方案
  evaluation:
    primary: rule_based
    required_findings:
    - RabbitMQ
    - Kafka
    - 双写过渡
    - 幂等处理
    should_ask_clarification: false
  ground_truth:
    expected_fact_ids:
    - migration_target
    - 3_reasons
    - 3_risks
    allowed_claims:
    - 从 RabbitMQ 迁移到 Kafka
    - 日均消息量 5000 万条
    - 采用双写过渡策略
    - 过渡期 4 周
- id: GT-DOC-004
  domain: GENERAL
  category: DOC_UNDERSTANDING
  task_type: ANALYSIS_ONLY
  complexity: MODERATE
  risk_level: MEDIUM
  prompt: 分析这份保险条款，列出理赔的条件、免赔额、以及除外责任。如果条款有模糊之处请指出。
  input_context: '机动车辆保险条款（商业险部分）


    第三章 保险责任

    第十八条 保险期间内，被保险人或其允许的合法驾驶人在使用被保险机动车过程中，

    因下列原因造成被保险机动车的直接损失，保险人依照本保险合同的约定负责赔偿：

    （一）碰撞、倾覆、坠落；

    （二）火灾、爆炸；

    （三）外界物体坠落、倒塌。


    第十九条 每次事故免赔额为损失金额的 10% 或人民币 500 元，以高者为准。


    第四章 责任免除

    第二十一条 下列情况下，不论任何原因造成被保险机动车损失，保险人均不负责赔偿：

    （一）地震及其次生灾害；

    （二）战争、军事冲突、恐怖活动、暴乱；

    （三）被保险机动车被盗窃、抢劫、抢夺期间造成的损坏；

    （四）驾驶人饮酒、吸食或注射毒品后驾车的。


    第二十二条 下列损失和费用，保险人不负责赔偿：

    （一）自然磨损、朽坏、腐蚀、故障；

    （二）车轮单独损坏、玻璃单独破碎、无明显碰撞痕迹的车身划痕；

    （三）人工直接供油、高温烘烤、自燃、不明原因火灾。'
  routing_metadata:
    history_messages: []
    n_tools: 0
    tool_result_length: 0
  expected_behavior:
  - 列出 3 类保险责任
  - 说明免赔额计算方式
  - 列出除外责任
  forbidden_behavior:
  - 声称全险无免赔
  - 添加条款中不存在的保障范围
  evaluation:
    primary: rule_based
    required_findings:
    - 碰撞
    - 火灾
    - 免赔额
    - 地震免除
    - 饮酒免除
    should_ask_clarification: false
  ground_truth:
    expected_fact_ids:
    - 3_coverages
    - deductible_rule
    - exclusions
    allowed_claims:
    - 碰撞、倾覆、坠落属于保险责任
    - 免赔额为损失10%或500元取高
    - 地震属于除外责任
    - 饮酒驾车属于除外责任
- id: GT-DOC-005
  domain: GENERAL
  category: DOC_UNDERSTANDING
  task_type: ANALYSIS_ONLY
  complexity: SIMPLE
  risk_level: LOW
  prompt: 总结这份员工手册中关于休假制度的规定，包括各类假期天数和请假流程。
  input_context: '员工手册 第七章 考勤与休假


    7.1 年假

    入职满1年不满10年的员工，年休假5天；满10年不满20年的，年休假10天；满20年的，年休假15天。


    7.2 病假

    员工因病或非因工负伤需要休息的，凭二级以上医院证明可申请病假。

    病假期间工资按基本工资的 80% 发放，全年累计不超过 60 天。


    7.3 婚假

    符合法定结婚年龄的员工，可享受婚假 3 天。晚婚（男25岁、女23岁以上初婚）另加 7 天。


    7.4 产假

    女员工产假 98 天，其中产前可休假 15 天。难产增加 15 天。多胞胎每多一个增加 15 天。

    男员工陪产假 15 天。


    7.5 请假流程

    1天以内由直属主管审批；1-3天需部门经理审批；3天以上需人力资源部审批。

    所有请假需提前在 OA 系统提交申请。'
  routing_metadata:
    history_messages: []
    n_tools: 0
    tool_result_length: 0
  expected_behavior:
  - 列出年假、病假、婚假、产假的天数规定
  - 说明请假审批层级
  forbidden_behavior:
  - 编造不存在的假期类型
  - 错误报告天数
  evaluation:
    primary: rule_based
    required_findings:
    - 年假
    - 病假
    - 婚假
    - 产假
    - 审批流程
    should_ask_clarification: false
  ground_truth:
    expected_fact_ids:
    - annual_leave_tiers
    - sick_leave
    - marriage_leave
    - maternity_leave
    allowed_claims:
    - 年假5-15天按工龄分级
    - 病假工资80%
    - 婚假3天晚婚加7天
    - 产假98天
- id: GT-DOC-006
  domain: GENERAL
  category: DOC_UNDERSTANDING
  task_type: ANALYSIS_ONLY
  complexity: MODERATE
  risk_level: LOW
  prompt: 阅读这份 API 文档，总结认证方式、请求频率限制、以及错误码含义。
  input_context: 'AI Router API v2 接口文档


    ## 认证

    所有请求须在 Header 中携带 API Key：

    Authorization: Bearer <your-api-key>


    API Key 可在控制台 > 设置 > API 密钥 中生成，每个项目最多 5 个 Key。


    ## 频率限制

    免费版：60 次/分钟，1000 次/天

    专业版：600 次/分钟，50000 次/天

    企业版：自定义，联系销售


    超出限制时返回 HTTP 429，响应体包含 Retry-After 头指示等待秒数。


    ## 错误码

    400: 请求参数错误，检查 JSON 格式和必填字段

    401: API Key 无效或已过期

    403: 无权访问目标资源

    404: 请求的模型或路由不存在

    429: 超出频率限制

    500: 服务端内部错误，请稍后重试

    503: 目标模型服务暂不可用'
  routing_metadata:
    history_messages: []
    n_tools: 0
    tool_result_length: 0
  expected_behavior:
  - 说明 Bearer Token 认证方式
  - 列出三个版本的频率限制
  - 列出主要错误码及其含义
  forbidden_behavior:
  - 编造不存在的认证方式
  - 错误报告限制数值
  evaluation:
    primary: rule_based
    required_findings:
    - Bearer
    - 频率限制
    - '429'
    - 错误码
    should_ask_clarification: false
  ground_truth:
    expected_fact_ids:
    - bearer_auth
    - rate_limits_3tiers
    - error_codes
    allowed_claims:
    - 使用 Bearer Token 认证
    - 免费版 60次/分钟
    - 429 表示超出频率限制
    - 401 表示 Key 无效
- id: GT-DOC-007
  domain: GENERAL
  category: DOC_UNDERSTANDING
  task_type: ANALYSIS_ONLY
  complexity: MODERATE
  risk_level: LOW
  prompt: 阅读这篇论文摘要，总结研究方法、实验设置、主要结论和局限性。
  input_context: '论文摘要：基于强化学习的 LLM 路由优化


    摘要：大语言模型（LLM）路由旨在为不同任务选择最优模型，以平衡质量与成本。

    本文提出 RL-Router，一种基于 PPO 算法的路由策略。我们在 5 个候选模型

    （GPT-4, Claude-3, Qwen-72B, Llama-70B, Mixtral-8x7B）上进行训练，

    使用 MMLU、HumanEval 和 GSM8K 三个基准数据集共 3000 条评测样本。


    方法：将路由建模为马尔可夫决策过程，状态空间包含任务文本嵌入和上下文特征，

    动作空间为 5 个候选模型。奖励函数 = 质量得分 - λ × 归一化成本，λ=0.3。

    使用 PPO 训练 100K 步，mini-batch size=64。


    结果：相比 cost-weighted baseline，RL-Router 在质量保持 95% 的前提下，

    平均成本降低 38%。在 HumanEval 上改善最显著（成本降低 52%），

    GSM8K 上改善最小（成本降低 18%）。


    局限：训练数据仅覆盖 3 个基准，实际生产任务分布可能不同；

    未考虑模型间的推理延迟差异；PPO 超参数未经充分调优。'
  routing_metadata:
    history_messages: []
    n_tools: 0
    tool_result_length: 0
  expected_behavior:
  - 总结 RL-Router 方法（PPO 强化学习）
  - 描述实验设置（5模型 × 3基准）
  - 报告主要结论（成本降低38%）
  - 列出局限性
  forbidden_behavior:
  - 声称方法优于 GPT-4
  - 编造未提及的实验结果
  evaluation:
    primary: rule_based
    required_findings:
    - PPO
    - 5个候选模型
    - 3个基准
    - 成本降低38%
    should_ask_clarification: false
  ground_truth:
    expected_fact_ids:
    - method_ppo
    - 5_models
    - 3_benchmarks
    - 38pct_cost_reduction
    allowed_claims:
    - 使用 PPO 算法
    - 5 个候选模型
    - 3000 条评测样本
    - 平均成本降低 38%
    - HumanEval 成本降低 52%
