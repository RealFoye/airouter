- id: GT-MT-007
  domain: GENERAL
  category: MULTI_TURN
  task_type: ANALYSIS_ONLY
  complexity: MODERATE
  risk_level: MEDIUM
  prompt: 根据之前的讨论，总结部署计划的时间线、负责人和回滚策略。
  input_context: ''
  routing_metadata:
    history_messages:
    - role: user
      content: 我们计划将数据库从 MySQL 5.7 迁移到 PostgreSQL 15，需要制定部署计划。
    - role: assistant
      content: 建议分三阶段：1) 搭建 PG 实例并双写同步（1周）2) 数据验证和切换读流量（1周）3) 切换写流量并下线 MySQL（1周）。
    - role: user
      content: 双写期间数据一致性怎么保证？我们日均写入 50 万条记录。
    - role: assistant
      content: 使用 CDC（Change Data Capture）工具如 Debezium 做增量同步。双写期间以 MySQL 为主，PG 为只读副本。每日运行校验脚本对比两边数据。
    - role: user
      content: 回滚策略呢？如果切换后发现问题怎么办？
    - role: assistant
      content: 写流量切换后保留 MySQL 实例 2 周不删除。回滚方案：修改 DNS 将写流量指回 MySQL，使用 PG 最后同步点之后的差异数据做反向同步。回滚预计 30 分钟内完成。
    n_tools: 0
    tool_result_length: 0
  expected_behavior:
  - 三阶段时间线（共3周）
  - 使用 Debezium CDC 同步
  - 回滚策略：保留 MySQL 2 周，30 分钟内回切
  forbidden_behavior:
  - 建议停机迁移
  evaluation:
    primary: rule_based
    required_findings:
    - 三阶段
    - CDC
    - Debezium
    - 回滚
    should_ask_clarification: false
  ground_truth:
    required_history_refs:
    - MySQL
    - PostgreSQL
    - Debezium
    - 回滚
