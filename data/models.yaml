# AI Router 模型注册表
# CCH 后台用量日志校准价（CNY per 1K tokens）
# 校准来源：2026-06-08 L2 真实 API smoke + CCH usage CSV，Cost(USD) 按 7.2 折 CNY

models:
  # ── Tier 1（重型）：规划、架构、复杂推理 ──

  # LLM Judge（不参与常规路由，专用于评测）
  - name: "claude-sonnet-4-6"
    tier: 1
    provider: "anthropic"
    api_base: "https://token.cvte.com/v1"
    input_price_per_1k: 0.0216    # CNY 21.6 / 1M (USD 3.0 / 1M * 7.2)
    output_price_per_1k: 0.108    # CNY 108 / 1M (USD 15.0 / 1M * 7.2)
    max_context_window: 200000
    capabilities:
      - judge
      - complex_reasoning
    allow_sensitive_data: true
    latency_estimate_ms: 5000

  - name: "qwen3.7-max"
    tier: 1
    provider: "dashscope"
    api_base: "https://token.cvte.com/v1"
    input_price_per_1k: 0.018     # CCH billing calibrated: CNY 18 / 1M
    output_price_per_1k: 0.054    # CCH billing calibrated: CNY 54 / 1M
    max_context_window: 991000
    capabilities:
      - code_gen
      - complex_reasoning
      - architecture
      - code_review
      - security
      - scalability
      - documentation
      - test_generation
      - data_processing
    allow_sensitive_data: true
    latency_estimate_ms: 3000
    cache:
      supports_prompt_caching: true
      cache_mode: explicit_or_implicit
      cache_write_price_multiplier: 1.25
      cache_read_price_ratio: 0.10
      cache_min_prefix_tokens: 1024
      cache_ttl_seconds: 300

