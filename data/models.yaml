# AI Router 模型注册表
# MVP 初始估计，需实测 API 后校准定价

models:
  # ── Tier 1（重型）：规划、架构、复杂推理 ──
  - name: "qwen3.7-max"
    tier: 1
    provider: "dashscope"
    api_base: "https://token.cvte.com/v1"
    input_price_per_1k: 0.012     # CNY per 1K tokens (CCH: CNY 12 / 1M)
    output_price_per_1k: 0.036    # CCH: CNY 36 / 1M
    max_context_window: 991000
    capabilities:
      - code_gen
      - complex_reasoning
      - architecture
      - code_review
      - security
      - scalability
      - documentation
      - test_generation
      - data_processing
    allow_sensitive_data: true
    latency_estimate_ms: 3000
    cache:
      supports_prompt_caching: true
      cache_mode: explicit_or_implicit
      cache_write_price_multiplier: 1.25
      cache_read_price_ratio: 0.10
      cache_min_prefix_tokens: 1024
      cache_ttl_seconds: 300

  - name: "deepseek-v4-pro"
    tier: 1
    provider: "deepseek"
    api_base: "https://token.cvte.com/v1"
    input_price_per_1k: 0.012     # CCH: CNY 12 / 1M
    output_price_per_1k: 0.024    # CCH: CNY 24 / 1M
    max_context_window: 1000000
